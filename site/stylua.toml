# How StyLua lays out the Lua the manual shows for its examples (see
# scripts/make-manual.lua)

syntax = "Lua54"
column_width = 80
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferSingle"
call_parentheses = "Always"
collapse_simple_statement = "Never"
