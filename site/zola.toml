#
# The Howlscript website, built by scripts/site. Its home, reference and converting
# pages are made from README.md, REFERENCE.md and CONVERTING.md.

base_url = "https://howlscript.io"
title = "Howlscript"
description = "An indentation-based language that compiles to Lua, for LuaJIT 2.1 and Lua 5.2 to 5.5"

# The pages made from the docs hold code like {{1, 2}}, which isn't Tera
skip_content_templating = ["_index.md", "reference.md", "converting.md"]

[markdown]
insert_anchor_links = "heading"

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"
extra_grammars = ["grammars/howl.tmLanguage.json"]

[extra]
repository = "https://github.com/nilnor/howlscript"
