#
# The Howlscript website, built by scripts/site. Its reference and converting pages
# are made from REFERENCE.md and CONVERTING.md, and the rest is in content/.

base_url = "https://howlscript.io"
title = "Howlscript"
description = "A clean, explicit language that compiles to Lua, for LuaJIT 2.1 and Lua 5.2 to 5.5"

# The pages hold code like {{1, 2}} and "#{#list}", which isn't Tera
skip_content_templating = ["**/*.md"]

[markdown]
insert_anchor_links = "heading"

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"
extra_grammars = ["grammars/howl.tmLanguage.json"]

[extra]
repository = "https://github.com/nilnor/howlscript"
